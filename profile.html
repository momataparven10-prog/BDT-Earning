<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - BDTxEarning</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f4f7fb;
      color:#1f2937;
    }

    .navbar{
      background:#111827;
      color:white;
      padding:16px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      font-size:22px;
      font-weight:bold;
    }

    .back-btn{
      background:#2563eb;
      color:white;
      text-decoration:none;
      padding:9px 15px;
      border-radius:8px;
      font-size:14px;
    }

    .container{
      max-width:900px;
      margin:25px auto;
      padding:0 15px;
    }

    .card{
      background:white;
      border-radius:14px;
      padding:22px;
      margin-bottom:20px;
      box-shadow:0 5px 20px rgba(0,0,0,.06);
    }

    .card h2{
      margin-bottom:18px;
      font-size:20px;
    }

    .balance{
      font-size:30px;
      font-weight:bold;
      color:#16a34a;
      margin-bottom:8px;
    }

    .label{
      display:block;
      margin:12px 0 6px;
      font-weight:bold;
      font-size:14px;
    }

    input,select{
      width:100%;
      padding:12px;
      border:1px solid #d1d5db;
      border-radius:8px;
      outline:none;
      font-size:15px;
    }

    input:focus,select:focus{
      border-color:#2563eb;
    }

    button{
      border:none;
      background:#2563eb;
      color:white;
      padding:12px 18px;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      margin-top:15px;
    }

    button:hover{
      background:#1d4ed8;
    }

    .success{
      color:#16a34a;
      margin-top:12px;
      font-size:14px;
    }

    .error{
      color:#dc2626;
      margin-top:12px;
      font-size:14px;
    }

    .table-wrap{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }

    th,td{
      padding:12px;
      border-bottom:1px solid #e5e7eb;
      text-align:left;
      font-size:14px;
      white-space:nowrap;
    }

    th{
      background:#f9fafb;
    }

    .pending{
      color:#d97706;
      font-weight:bold;
    }

    .approved{
      color:#16a34a;
      font-weight:bold;
    }

    .rejected{
      color:#dc2626;
      font-weight:bold;
    }

    .loading{
      text-align:center;
      padding:30px;
    }

    @media(max-width:600px){
      .card{
        padding:17px;
      }

      .navbar{
        padding:13px 15px;
      }

      .logo{
        font-size:19px;
      }
    }
  </style>
</head>

<body>

  <div class="navbar">
    <div class="logo">BDTxEarning</div>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="container">

    <!-- PROFILE -->
    <div class="card">
      <h2>👤 Profile Information</h2>

      <label class="label">Full Name</label>
      <input type="text" id="fullName" placeholder="আপনার নাম">

      <label class="label">Username</label>
      <input type="text" id="username" placeholder="Username">

      <label class="label">Email</label>
      <input type="email" id="email" readonly>

      <label class="label">Referral Code</label>
      <input type="text" id="referralCode" readonly>

      <button onclick="updateProfile()">Update Profile</button>

      <div id="profileMessage"></div>
    </div>


    <!-- PAYMENT -->
    <div class="card">
      <h2>💳 Payment Information</h2>

      <label class="label">Payment Method</label>
      <select id="paymentMethod">
        <option value="">Select Payment Method</option>
        <option value="bKash">bKash</option>
        <option value="Nagad">Nagad</option>
        <option value="Rocket">Rocket</option>
        <option value="Bank">Bank</option>
      </select>

      <label class="label">Account Number</label>
      <input type="text" id="accountNumber" placeholder="01XXXXXXXXX">

      <label class="label">Account Name</label>
      <input type="text" id="accountName" placeholder="Account Holder Name">

      <button onclick="savePayment()">Save Payment Information</button>

      <div id="paymentMessage"></div>
    </div>


    <!-- WITHDRAW -->
    <div class="card">
      <h2>💸 Withdraw</h2>

      <div class="balance">
        ৳ <span id="balance">0.00</span>
      </div>

      <p>Available Balance</p>

      <label class="label">Withdraw Amount</label>
      <input type="number" id="withdrawAmount" placeholder="Enter amount" min="1" step="0.01">

      <button onclick="requestWithdraw()">Request Withdraw</button>

      <div id="withdrawMessage"></div>
    </div>


    <!-- HISTORY -->
    <div class="card">
      <h2>📋 Withdraw History</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Amount</th>
              <th>Method</th>
              <th>Account</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>

          <tbody id="withdrawHistory">
            <tr>
              <td colspan="5" class="loading">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>


<script>

const SUPABASE_URL = "https://hmshjrqrogczsvxtwkqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tLNKwPxwoceKvJG2DpR6jw_VE9KaExr";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentBalance = 0;


// ===============================
// LOAD USER
// ===============================

async function loadUser(){

  const {
    data:{user},
    error
  } = await supabaseClient.auth.getUser();

  if(error || !user){

    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  document.getElementById("email").value =
    user.email || "";

  await loadProfile();
  await loadPayment();
  await loadWithdrawHistory();
}


// ===============================
// LOAD PROFILE
// ===============================

async function loadProfile(){

  const {data,error} =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){

    console.log(error);
    return;
  }

  if(!data){
    return;
  }

  document.getElementById("fullName").value =
    data.full_name || "";

  document.getElementById("username").value =
    data.username || "";

  document.getElementById("referralCode").value =
    data.referral_code || "";

  currentBalance =
    Number(data.balance || 0);

  document.getElementById("balance").textContent =
    currentBalance.toFixed(2);
}


// ===============================
// UPDATE PROFILE
// ===============================

async function updateProfile(){

  const fullName =
    document.getElementById("fullName").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const message =
    document.getElementById("profileMessage");

  message.innerHTML = "";

  const {error} =
    await supabaseClient
    .from("profiles")
    .update({
      full_name:fullName,
      username:username
    })
    .eq("id",currentUser.id);

  if(error){

    message.innerHTML =
      `<div class="error">${error.message}</div>`;

    return;
  }

  message.innerHTML =
    `<div class="success">
      ✓ Profile updated successfully
    </div>`;
}


// ===============================
// LOAD PAYMENT
// ===============================

async function loadPayment(){

  const {data,error} =
    await supabaseClient
    .from("payment_methods")
    .select("*")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(error){

    console.log(error);
    return;
  }

  if(!data){
    return;
  }

  document.getElementById("paymentMethod").value =
    data.method || "";

  document.getElementById("accountNumber").value =
    data.account_number || "";

  document.getElementById("accountName").value =
    data.account_name || "";
}


// ===============================
// SAVE PAYMENT
// ===============================

async function savePayment(){

  const method =
    document.getElementById("paymentMethod").value;

  const accountNumber =
    document.getElementById("accountNumber").value.trim();

  const accountName =
    document.getElementById("accountName").value.trim();

  const message =
    document.getElementById("paymentMessage");

  message.innerHTML = "";

  if(!method || !accountNumber){

    message.innerHTML =
      `<div class="error">
        Payment method এবং account number দিন।
      </div>`;

    return;
  }

  const {error} =
    await supabaseClient
    .from("payment_methods")
    .upsert({
      user_id:currentUser.id,
      method:method,
      account_number:accountNumber,
      account_name:accountName,
      updated_at:new Date().toISOString()
    },{
      onConflict:"user_id"
    });

  if(error){

    message.innerHTML =
      `<div class="error">${error.message}</div>`;

    return;
  }

  message.innerHTML =
    `<div class="success">
      ✓ Payment information saved successfully
    </div>`;
}


// ===============================
// WITHDRAW
// ===============================

async function requestWithdraw(){

  const amount =
    Number(
      document.getElementById("withdrawAmount").value
    );

  const method =
    document.getElementById("paymentMethod").value;

  const accountNumber =
    document.getElementById("accountNumber").value.trim();

  const message =
    document.getElementById("withdrawMessage");

  message.innerHTML = "";

  if(!amount || amount <= 0){

    message.innerHTML =
      `<div class="error">
        সঠিক amount লিখুন।
      </div>`;

    return;
  }

  if(amount > currentBalance){

    message.innerHTML =
      `<div class="error">
        আপনার balance পর্যাপ্ত নয়।
      </div>`;

    return;
  }

  if(!method || !accountNumber){

    message.innerHTML =
      `<div class="error">
        আগে Payment Information save করুন।
      </div>`;

    return;
  }

  message.innerHTML =
    `<div class="success">
      Withdrawal request তৈরি হচ্ছে...
    </div>`;

  const {data,error} =
    await supabaseClient
    .from("withdraw_requests")
    .insert({
      user_id:currentUser.id,
      amount:amount,
      payment_method:method,
      account_number:accountNumber,
      status:"pending"
    })
    .select()
    .single();

  if(error){

    message.innerHTML =
      `<div class="error">${error.message}</div>`;

    return;
  }

  message.innerHTML =
    `<div class="success">
      ✓ Withdrawal request submitted successfully
    </div>`;

  document.getElementById("withdrawAmount").value = "";

  await loadWithdrawHistory();
}


// ===============================
// LOAD WITHDRAW HISTORY
// ===============================

async function loadWithdrawHistory(){

  const tbody =
    document.getElementById("withdrawHistory");

  const {data,error} =
    await supabaseClient
    .from("withdraw_requests")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){

    tbody.innerHTML =
      `<tr>
        <td colspan="5" class="error">
          ${error.message}
        </td>
      </tr>`;

    return;
  }

  if(!data || data.length === 0){

    tbody.innerHTML =
      `<tr>
        <td colspan="5">
          এখনো কোনো withdrawal request নেই।
        </td>
      </tr>`;

    return;
  }

  tbody.innerHTML = "";

  data.forEach(item => {

    let statusClass = "";

    if(item.status === "pending"){
      statusClass = "pending";
    }

    if(item.status === "approved"){
      statusClass = "approved";
    }

    if(item.status === "rejected"){
      statusClass = "rejected";
    }

    const date =
      new Date(item.created_at)
      .toLocaleString("en-BD");

    tbody.innerHTML += `
      <tr>

        <td>৳ ${Number(item.amount).toFixed(2)}</td>

        <td>${item.payment_method}</td>

        <td>${item.account_number}</td>

        <td class="${statusClass}">
          ${item.status}
        </td>

        <td>${date}</td>

      </tr>
    `;
  });
}


// ===============================
// START
// ===============================

loadUser();

</script>

</body>
</html>
