<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://hmshjrqrogczsvxtwkqi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_tLNKwPxwoceKvJG2DpR6jw_VE9KaExr";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* =========================
   START ADMIN
========================= */

async function startAdmin() {

  try {

    /* Get current session */
    const {
      data: sessionData,
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      console.error("Session Error:", sessionError);
      showLogin();
      return;
    }

    const session = sessionData?.session;

    /* Login না থাকলে Login page */
    if (!session) {
      showLogin();
      return;
    }

    console.log("Logged in user:", session.user.email);

    /* Check Admin */
    const {
      data: isAdmin,
      error: adminError
    } = await supabaseClient.rpc("admin_check");

    console.log("Admin check:", isAdmin);
    console.log("Admin error:", adminError);

    if (adminError) {
      console.error(adminError);

      showMessage(
        "Admin check error: " + adminError.message,
        "error"
      );

      return;
    }

    if (isAdmin !== true) {

      alert("আপনার Admin access নেই।");

      window.location.href = "dashboard.html";

      return;
    }

    /* Admin হলে Dashboard load */
    await loadDashboard();
    await loadUsers();
    await loadLinks();
    await loadWithdrawals();
    await loadSettings();

  } catch (error) {

    console.error("Admin Error:", error);

    showMessage(
      error.message || "Admin panel load failed",
      "error"
    );
  }
}


/* =========================
   LOGIN REDIRECT
========================= */

function showLogin() {

  window.location.href = "login.html";
}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    console.log(
      "Auth event:",
      event
    );

    if (
      event === "SIGNED_IN" &&
      session
    ) {

      console.log(
        "Signed in:",
        session.user.email
      );

      await startAdmin();

    }

  }
);


/* =========================
   DASHBOARD
========================= */

async function loadDashboard() {

  const {
    data,
    error
  } = await supabaseClient.rpc(
    "admin_dashboard_stats"
  );

  if (error) {

    console.error(error);
    return;
  }

  document.getElementById(
    "statUsers"
  ).textContent =
    data?.users || 0;

  document.getElementById(
    "statLinks"
  ).textContent =
    data?.links || 0;

  document.getElementById(
    "statClicks"
  ).textContent =
    data?.clicks || 0;

  document.getElementById(
    "statBalance"
  ).textContent =
    "৳" +
    Number(
      data?.balance || 0
    ).toFixed(2);

  document.getElementById(
    "statWithdraw"
  ).textContent =
    data?.pending_withdrawals || 0;
}


/* =========================
   USERS
========================= */

async function loadUsers() {

  const {
    data,
    error
  } = await supabaseClient.rpc(
    "admin_get_users"
  );

  if (error) {

    console.error(error);

    document.getElementById(
      "usersTable"
    ).innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          Users load করা যায়নি।
        </td>
      </tr>
    `;

    return;
  }

  const users = data || [];

  if (!users.length) {

    document.getElementById(
      "usersTable"
    ).innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          কোনো User পাওয়া যায়নি।
        </td>
      </tr>
    `;

    return;
  }

  let html = "";

  users.forEach(user => {

    html += `
      <tr>

        <td>
          ${escapeHtml(user.full_name || "-")}
        </td>

        <td>
          ${escapeHtml(user.username || "-")}
        </td>

        <td>
          ৳${Number(user.balance || 0).toFixed(2)}
        </td>

        <td>
          ৳${Number(
            user.referral_balance || 0
          ).toFixed(2)}
        </td>

        <td>
          <button
            class="btn blue"
            onclick="changeBalance('${user.id}')"
          >
            Balance
          </button>
        </td>

      </tr>
    `;

  });

  document.getElementById(
    "usersTable"
  ).innerHTML = html;
}


/* =========================
   CHANGE BALANCE
========================= */

async function changeBalance(userId) {

  const amount = prompt(
    "Balance পরিবর্তন করুন।\n\n" +
    "যোগ করতে: 50\n" +
    "কমাতে: -50"
  );

  if (
    amount === null ||
    amount.trim() === ""
  ) {
    return;
  }

  const value = Number(amount);

  if (!Number.isFinite(value)) {

    alert("সঠিক Amount দিন।");
    return;
  }

  const {
    error
  } = await supabaseClient.rpc(
    "admin_update_balance",
    {
      p_user_id: userId,
      p_amount: value
    }
  );

  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  showMessage(
    "Balance সফলভাবে পরিবর্তন হয়েছে।",
    "success"
  );

  await loadUsers();
  await loadDashboard();
}


/* =========================
   LINKS
========================= */

async function loadLinks() {

  const {
    data,
    error
  } = await supabaseClient.rpc(
    "admin_get_links"
  );

  if (error) {

    console.error(error);
    return;
  }

  const links = data || [];

  if (!links.length) {

    document.getElementById(
      "linksTable"
    ).innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          কোনো Link পাওয়া যায়নি।
        </td>
      </tr>
    `;

    return;
  }

  let html = "";

  links.forEach(link => {

    html += `
      <tr>

        <td>
          <strong>
            ${escapeHtml(
              link.short_code || "-"
            )}
          </strong>
        </td>

        <td>
          ${escapeHtml(
            link.original_url || "-"
          )}
        </td>

        <td>
          ${Number(link.clicks || 0)}
        </td>

        <td>
          ${escapeHtml(
            link.user_id || "-"
          )}
        </td>

        <td>

          <button
            class="btn red"
            onclick="deleteLink(${link.id})"
          >
            Delete
          </button>

        </td>

      </tr>
    `;

  });

  document.getElementById(
    "linksTable"
  ).innerHTML = html;
}


/* =========================
   DELETE LINK
========================= */

async function deleteLink(id) {

  if (
    !confirm(
      "এই Short Link Delete করতে চান?"
    )
  ) {
    return;
  }

  const {
    error
  } = await supabaseClient.rpc(
    "admin_delete_link",
    {
      p_link_id: id
    }
  );

  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  showMessage(
    "Short Link Delete হয়েছে।",
    "success"
  );

  await loadLinks();
  await loadDashboard();
}


/* =========================
   WITHDRAWALS
========================= */

async function loadWithdrawals() {

  const {
    data,
    error
  } = await supabaseClient.rpc(
    "admin_get_withdrawals"
  );

  if (error) {

    console.error(error);

    document.getElementById(
      "withdrawalsTable"
    ).innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          Withdrawals load করা যায়নি।
        </td>
      </tr>
    `;

    return;
  }

  const withdrawals = data || [];

  if (!withdrawals.length) {

    document.getElementById(
      "withdrawalsTable"
    ).innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          কোনো Withdrawal Request নেই।
        </td>
      </tr>
    `;

    return;
  }

  let html = "";

  withdrawals.forEach(w => {

    const status =
      String(w.status || "")
        .toLowerCase();

    let statusClass = "pending";

    if (status === "approved") {
      statusClass = "approved";
    }

    if (status === "rejected") {
      statusClass = "rejected";
    }

    const date =
      w.created_at
        ? new Date(
            w.created_at
          ).toLocaleDateString("bn-BD")
        : "-";

    let actions = "-";

    if (status === "pending") {

      actions = `
        <button
          class="btn green"
          onclick="approveWithdrawal(${w.id})"
        >
          Approve
        </button>

        <button
          class="btn red"
          onclick="rejectWithdrawal(${w.id})"
        >
          Reject
        </button>
      `;

    }

    html += `
      <tr>

        <td>
          ৳${Number(
            w.amount || 0
          ).toFixed(2)}
        </td>

        <td>
          ${escapeHtml(
            w.payment_method || "-"
          )}
        </td>

        <td>
          ${escapeHtml(
            w.account_number || "-"
          )}
        </td>

        <td>
          <span
            class="status ${statusClass}"
          >
            ${escapeHtml(
              status || "-"
            )}
          </span>
        </td>

        <td>
          ${date}
        </td>

        <td>
          ${actions}
        </td>

      </tr>
    `;

  });

  document.getElementById(
    "withdrawalsTable"
  ).innerHTML = html;
}


/* =========================
   APPROVE
========================= */

async function approveWithdrawal(id) {

  if (
    !confirm(
      "এই Withdrawal Approve করতে চান?"
    )
  ) {
    return;
  }

  const {
    error
  } = await supabaseClient.rpc(
    "admin_approve_withdrawal",
    {
      p_withdraw_id: id
    }
  );

  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  showMessage(
    "Withdrawal Approved হয়েছে।",
    "success"
  );

  await loadWithdrawals();
  await loadDashboard();
}


/* =========================
   REJECT
========================= */

async function rejectWithdrawal(id) {

  const note = prompt(
    "Reject করার কারণ লিখুন:"
  );

  if (note === null) {
    return;
  }

  const {
    error
  } = await supabaseClient.rpc(
    "admin_reject_withdrawal",
    {
      p_withdraw_id: id,
      p_admin_note: note
    }
  );

  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  showMessage(
    "Withdrawal Reject হয়েছে এবং Balance ফেরত দেওয়া হয়েছে।",
    "success"
  );

  await loadWithdrawals();
  await loadUsers();
  await loadDashboard();
}


/* =========================
   SETTINGS
========================= */

async function loadSettings() {

  const {
    data,
    error
  } = await supabaseClient.rpc(
    "admin_get_settings"
  );

  if (error) {

    console.error(error);
    return;
  }

  const settings = data || {};

  const fields = [
    "monetag_direct_link",
    "unlock_pages",
    "unlock_timer",
    "unlock_button_text",
    "ads_enabled",
    "click_earning",
    "minimum_withdrawal",
    "referral_earning"
  ];

  fields.forEach(key => {

    const element =
      document.getElementById(key);

    if (
      element &&
      settings[key] !== undefined
    ) {

      element.value =
        settings[key];

    }

  });
}


/* =========================
   SAVE SETTINGS
========================= */

async function saveSettings() {

  const fields = [
    "monetag_direct_link",
    "unlock_pages",
    "unlock_timer",
    "unlock_button_text",
    "ads_enabled",
    "click_earning",
    "minimum_withdrawal",
    "referral_earning"
  ];

  for (const key of fields) {

    const element =
      document.getElementById(key);

    if (!element) {
      continue;
    }

    const {
      error
    } = await supabaseClient.rpc(
      "admin_update_setting",
      {
        p_key: key,
        p_value: element.value
      }
    );

    if (error) {

      showMessage(
        "Setting save error: " +
        error.message,
        "error"
      );

      return;
    }

  }

  showMessage(
    "সব Settings সফলভাবে Save হয়েছে।",
    "success"
  );
}


/* =========================
   TABS
========================= */

function showPanel(
  panelId,
  button
) {

  document
    .querySelectorAll(".panel")
    .forEach(panel => {

      panel.classList.remove(
        "active"
      );

    });

  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.classList.remove(
        "active"
      );

    });

  document
    .getElementById(panelId)
    .classList.add("active");

  button.classList.add("active");
}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent = text;

  box.className =
    "message " + type;

  setTimeout(() => {

    box.className =
      "message";

  }, 4000);
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";
}


/* =========================
   SECURITY
========================= */

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}


/* =========================
   START
========================= */

startAdmin();

</script>
