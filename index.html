===================================================== */

function getVisitorId(){

  let visitorId = null;

  try{

    visitorId =
      localStorage.getItem(
        "bdtx_visitor_id"
      );


    if(!visitorId){

      if(
        window.crypto &&
        typeof window.crypto.randomUUID ===
        "function"
      ){

        visitorId =
          window.crypto.randomUUID();

      }else{

        visitorId =
          "v_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2,12);

      }


      localStorage.setItem(
        "bdtx_visitor_id",
        visitorId
      );

    }

  }catch(error){

    console.warn(
      "Visitor ID error:",
      error
    );


    visitorId =
      "v_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2,12);

  }

  return visitorId;
}

/* =====================================================
   AUTH CHECK
===================================================== */

async function checkAuth(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if(error){

    console.error(
      "Auth error:",
      error
    );

    return;
  }


  currentUser =
    data?.session?.user || null;


  updateAuthUI();


  if(currentUser){

    await loadProfile();

  }

}


/* =====================================================
   UPDATE AUTH UI
===================================================== */

function updateAuthUI(){

  const loginBtn =
    document.getElementById(
      "loginNavBtn"

  const registerBtn =

      "registerNavBtn"
    );

  const logoutBtn =
    document.getElementById(
      "logoutNavBtn"
    );


  if(currentUser){

    loginBtn.classList.add(
      "hidden"
    );

    registerBtn.classList.add(
      "hidden"
    );

    logoutBtn.classList.remove(
      "hidden"
    );

  }else{

    loginBtn.classList.remove(
      "hidden"
    );

    registerBtn.classList.remove(
      "hidden"
    );

    logoutBtn.classList.add(
      "hidden"
    );

  }

}

    document
      .getElementById(
        "loginPassword"
      )
      .value;

    );

    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email:
          email,

        password:
          password

      });


    if(error){

      throw error;

    }


    currentUser =

    updateAuthUI();

/* =====================================================

async function registerUser(){

  const name =
    document
      .getElementById(
        "registerName"
      )
      .value
      .trim();


  const username =
    document
      .getElementById(
        "registerUsername"
      )
      .value
      .trim();


  const email =
    document
      .getElementById(
        "registerEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "registerPassword"
      )
      .value;


  if(
    !name ||
    !username ||
    !email ||
    !password
  ){

    alert(
      "সব তথ্য পূরণ করুন।"
    );

    return;
  }


  if(password.length < 6){

    alert(

    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email:

        password:

        options:{
          data:{
            full_name:

            username:

        }

    if(error){

    if(data.user){

===================================================== */

  if(!currentUser){

    return;

  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,full_name,username,email,balance"
        )
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if(error){

      console.error(

      );

      return;

    }


    if(!data){

    document
      .getElementById(
        "profileName"

/* =====================================================
   SHORTEN LINK
===================================================== */

async function shortenLink(){

  const input =
    document.getElementById(
      "longUrl"
    );


  const button =
    document.getElementById(
      "shortenBtn"
    );


  const url =
    input.value.trim();


  if(!url){

    alert(
      "একটি URL দিন।"
    );

    return;

  }


  try{

    new URL(url);

  }catch{

    alert(
      "সঠিক URL দিন।"
    );

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "Creating...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "create_short_link",
        {
          p_original_url:
            url
        }
      );


    if(error){

      throw error;

    }


    let shortCode = "";


    if(
      typeof data ===
      "string"
    ){

      shortCode =
        data;

    }else if(
      data &&
      typeof data ===
      "object"
    ){

      shortCode =
        data.short_code ||
        data.code ||
        data[0]?.short_code ||
        data[0]?.code ||
        "";

    }


    if(!shortCode){

      throw new Error(
        "Short code পাওয়া যায়নি।"
      );

    }


    /*
      Short Link সবসময় BDTxEarning
      domain-এই থাকবে।

      User ক্লিক করলে handleShortLink()
      Blogger-এ পাঠাবে।
    */

    const shortUrl =
      window.location.origin +
      window.location.pathname +
      "?c=" +
      encodeURIComponent(
        shortCode
      );


    document
      .getElementById(
        "shortLinkText"
      )
      .textContent =
        shortUrl;


    document
      .getElementById(
        "shortResult"
      )
      .classList.remove(
        "hidden"
      );


  }catch(error){

    console.error(
      "Shorten error:",
      error
    );


    alert(
      error.message ||
      "Short Link তৈরি করা যায়নি।"
    );


  }finally{

    button.disabled =
      false;


    button.textContent =
      "Shorten";

  }

}


/* =====================================================
   COPY SHORT LINK
===================================================== */

async function copyShortLink(){

  const text =
    document
      .getElementById(
        "shortLinkText"
      )
      .textContent;


  if(!text){

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );


    alert(
      "Short Link Copy হয়েছে।"
    );


  }catch{

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    alert(
      "Short Link Copy হয়েছে।"
    );

  }

}
