<script>

/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL =
    "https://hmshjrqrogczsvxtwkqi.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_tLNKwPxwoceKvJG2DpR6jw_VE9KaExr";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let originalUrl = "";

let currentStep = 1;

let totalSteps = 1;

let timerSeconds = 5;

let timerInterval = null;

let settings = {};


/* =====================================================
   SHORT LINK CREATION
   ===================================================== */

async function createShortLink() {

    const input =
        document.getElementById(
            "longUrl"
        );

    const result =
        document.getElementById(
            "shortResult"
        );


    const url =
        input.value.trim();


    if (!url) {

        result.innerHTML = `
            <div style="
                background:#fef2f2;
                color:#dc2626;
                padding:12px;
                border-radius:8px;
            ">
                একটি Long Link দিন।
            </div>
        `;

        return;
    }


    /* Basic URL check */

    try {

        new URL(url);

    } catch (error) {

        result.innerHTML = `
            <div style="
                background:#fef2f2;
                color:#dc2626;
                padding:12px;
                border-radius:8px;
            ">
                সঠিক URL দিন।
            </div>
        `;

        return;
    }


    result.innerHTML = `
        <div style="
            color:#2563eb;
            padding:10px;
        ">
            Link তৈরি হচ্ছে...
        </div>
    `;


    try {

        /*
         * Existing project-এর
         * create_short_link RPC
         */

        const {
            data,
            error
        } = await supabaseClient.rpc(
            "create_short_link",
            {
                p_original_url: url
            }
        );


        if (error) {

            console.error(
                "create_short_link error:",
                error
            );

            throw error;
        }


        if (!data) {

            throw new Error(
                "Short code পাওয়া যায়নি।"
            );
        }


        /*
         * RPC যদি সরাসরি short_code দেয়
         */

        let shortCode = data;


        /*
         * যদি object আকারে return করে
         */

        if (
            typeof data === "object" &&
            data !== null
        ) {

            shortCode =
                data.short_code ||
                data.code ||
                data.id;
        }


        if (!shortCode) {

            throw new Error(
                "Short code পাওয়া যায়নি।"
            );
        }


        const shortUrl =
            window.location.origin +
            "/?c=" +
            encodeURIComponent(
                shortCode
            );


        result.innerHTML = `

            <div style="
                background:#f0fdf4;
                border:1px solid #bbf7d0;
                padding:15px;
                border-radius:10px;
                text-align:left;
            ">

                <div style="
                    color:#15803d;
                    font-weight:700;
                    margin-bottom:10px;
                ">
                    ✓ Short Link তৈরি হয়েছে
                </div>


                <input
                    value="${shortUrl}"
                    readonly
                    onclick="this.select()"
                    style="
                        width:100%;
                        padding:11px;
                        border:1px solid #d1d5db;
                        border-radius:7px;
                        margin-bottom:10px;
                    "
                >


                <button
                    type="button"
                    onclick="copyShortLink('${shortUrl.replace(/'/g, "\\'")}')"
                    style="
                        width:100%;
                        border:none;
                        background:#16a34a;
                        color:white;
                        padding:11px;
                        border-radius:7px;
                        font-weight:700;
                        cursor:pointer;
                    "
                >
                    Copy Short Link
                </button>

            </div>

        `;


    } catch (error) {

        console.error(
            "Short link creation error:",
            error
        );


        result.innerHTML = `

            <div style="
                background:#fef2f2;
                color:#dc2626;
                padding:12px;
                border-radius:8px;
            ">

                Link তৈরি করা যায়নি।

            </div>

        `;
    }
}


/* =====================================================
   COPY SHORT LINK
   ===================================================== */

async function copyShortLink(
    text
) {

    try {

        await navigator.clipboard.writeText(
            text
        );

        alert(
            "Short Link Copy হয়েছে।"
        );

    } catch (error) {

        prompt(
            "Short Link Copy করুন:",
            text
        );
    }
}


/* =====================================================
   HANDLE SHORT LINK
   ===================================================== */

async function handleShortLink() {


    const params =
        new URLSearchParams(
            window.location.search
        );


    const code =
        params.get("c");


    /*
     * Normal homepage
     */

    if (!code) {

        return;
    }


    const homePage =
        document.getElementById(
            "homePage"
        );


    const redirectMessage =
        document.getElementById(
            "redirectMessage"
        );


    if (homePage) {

        homePage.style.display =
            "none";
    }


    if (redirectMessage) {

        redirectMessage.style.display =
            "flex";
    }


    try {


        /* =========================================
           GET ORIGINAL URL
           ========================================= */

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "open_short_link",
                {
                    code: code
                }
            );


        if (error) {

            console.error(
                "open_short_link error:",
                error
            );

            throw error;
        }


        if (!data) {

            showError(
                "এই Short Link পাওয়া যায়নি।"
            );

            return;
        }


        originalUrl =
            data;


        /*
         * If function returns object
         */

        if (
            typeof data === "object" &&
            data !== null
        ) {

            originalUrl =
                data.original_url ||
                data.url ||
                data.destination ||
                "";
        }


        if (!originalUrl) {

            showError(
                "Original Link পাওয়া যায়নি।"
            );

            return;
        }


        /* =========================================
           GET UNLOCK SETTINGS
           ========================================= */

        const {
            data: unlockSettings,
            error: settingsError
        } =
            await supabaseClient.rpc(
                "get_unlock_settings"
            );


        if (settingsError) {

            console.error(
                "get_unlock_settings error:",
                settingsError
            );

            throw settingsError;
        }


        settings =
            unlockSettings || {};


        /* =========================================
           TOTAL UNLOCK PAGES
           ========================================= */

        totalSteps =
            parseInt(
                settings.unlock_pages ||
                1,
                10
            );


        if (
            !Number.isFinite(
                totalSteps
            ) ||
            totalSteps < 1
        ) {

            totalSteps = 1;
        }


        /*
         * Maximum 5 unlock pages
         */

        totalSteps =
            Math.min(
                totalSteps,
                5
            );


        /* =========================================
           TIMER
           ========================================= */

        timerSeconds =
            parseInt(
                settings.unlock_timer ||
                5,
                10
            );


        if (
            !Number.isFinite(
                timerSeconds
            ) ||
            timerSeconds < 0
        ) {

            timerSeconds = 0;
        }


        /* =========================================
           START
           ========================================= */

        currentStep = 1;


        showUnlockStep();


    } catch (error) {


        console.error(
            "Short link error:",
            error
        );


        showError(
            "এই Short Link এখন পাওয়া যাচ্ছে না।"
        );

    }

}


/* =====================================================
   SHOW UNLOCK STEP
   ===================================================== */

function showUnlockStep() {


    clearInterval(
        timerInterval
    );


    const container =
        document.getElementById(
            "redirectMessage"
        );


    if (!container) {

        return;
    }


    const buttonText =
        settings.unlock_button_text ||
        "Unlock Link";


    container.innerHTML = `

        <div class="unlock-box">

            <div class="unlock-icon">
                🔓
            </div>


            <h2>
                Link Unlock করুন
            </h2>


            <p>
                নিচের Timer শেষ হওয়া পর্যন্ত
                অপেক্ষা করুন। তারপর Unlock
                Button চাপুন।
            </p>


            <div class="unlock-progress">

                <div class="unlock-step">

                    Step
                    ${currentStep}
                    /
                    ${totalSteps}

                </div>

            </div>


            <div
                id="unlockTimer"
                class="unlock-timer"
            >
                ${timerSeconds}
            </div>


            <button
                id="unlockButton"
                type="button"
                disabled
            >
                ${buttonText}
            </button>


            <div
                id="unlockStatus"
            >
                Please wait...
            </div>

        </div>

    `;


    /*
     * Button click event
     */

    const button =
        document.getElementById(
            "unlockButton"
        );


    if (button) {

        button.addEventListener(
            "click",
            handleUnlock
        );
    }


    /*
     * Start timer
     */

    startTimer();

}


/* =====================================================
   START TIMER
   ===================================================== */

function startTimer() {


    clearInterval(
        timerInterval
    );


    const timerElement =
        document.getElementById(
            "unlockTimer"
        );


    if (
        timerSeconds <= 0
    ) {

        enableUnlockButton();

        return;
    }


    let remaining =
        timerSeconds;


    if (timerElement) {

        timerElement.innerText =
            remaining;
    }


    timerInterval =
        setInterval(
            function () {


                remaining--;


                if (timerElement) {

                    timerElement.innerText =
                        remaining;
                }


                if (
                    remaining <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    if (timerElement) {

                        timerElement.innerText =
                            "✓";
                    }


                    enableUnlockButton();

                }


            },
            1000
        );

}


/* =====================================================
   ENABLE UNLOCK BUTTON
   ===================================================== */

function enableUnlockButton() {


    const button =
        document.getElementById(
            "unlockButton"
        );


    const status =
        document.getElementById(
            "unlockStatus"
        );


    if (button) {

        button.disabled =
            false;


        button.innerText =
            settings.unlock_button_text ||
            "Unlock Link";


        button.style.opacity =
            "1";


        button.style.cursor =
            "pointer";

    }


    if (status) {

        status.innerText =
            "Timer শেষ হয়েছে। এখন Unlock Button চাপুন।";


        status.style.color =
            "#16a34a";
    }

}


/* =====================================================
   HANDLE UNLOCK
   ===================================================== */

async function handleUnlock() {


    try {


        const button =
            document.getElementById(
                "unlockButton"
            );


        const status =
            document.getElementById(
                "unlockStatus"
            );


        /*
         * Prevent double click
         */

        if (button) {

            button.disabled =
                true;


            button.style.opacity =
                "0.6";


            button.style.cursor =
                "wait";


            button.innerText =
                "Processing...";
        }


        if (status) {

            status.innerText =
                "Unlock করা হচ্ছে...";
        }


        /* =========================================
           ADS SETTINGS
           ========================================= */

        const adsEnabled =
            String(
                settings.ads_enabled
            ).toLowerCase() ===
            "true";


        const directLink =
            String(
                settings.monetag_direct_link ||
                ""
            ).trim();


        /* =========================================
           OPEN MONETAG DIRECT LINK
           ========================================= */

        if (
            adsEnabled &&
            directLink !== ""
        ) {


            /*
             * Open in new tab
             */

            const newWindow =
                window.open(
                    directLink,
                    "_blank"
                );


            /*
             * Popup blocked
             */

            if (!newWindow) {


                if (status) {

                    status.innerText =
                        "Ad খুলতে Browser popup permission প্রয়োজন।";
                }


                if (button) {

                    button.disabled =
                        false;


                    button.style.opacity =
                        "1";


                    button.style.cursor =
                        "pointer";


                    button.innerText =
                        settings.unlock_button_text ||
                        "Unlock Link";
                }


                return;
            }

        }


        /* =========================================
           NEXT UNLOCK PAGE
           ========================================= */

        if (
            currentStep <
            totalSteps
        ) {


            currentStep++;


            setTimeout(
                function () {

                    showUnlockStep();

                },
                500
            );


            return;
        }


        /* =========================================
           ALL UNLOCKS COMPLETE
           ========================================= */

        if (status) {

            status.innerText =
                "সব Unlock সম্পন্ন হয়েছে...";
        }


        setTimeout(
            function () {

                goToOriginalUrl();

            },
            500
        );


    } catch (error) {


        console.error(
            "Unlock error:",
            error
        );


        const button =
            document.getElementById(
                "unlockButton"
            );


        const status =
            document.getElementById(
                "unlockStatus"
            );


        if (button) {

            button.disabled =
                false;


            button.style.opacity =
                "1";


            button.style.cursor =
                "pointer";


            button.innerText =
                settings.unlock_button_text ||
                "Unlock Link";
        }


        if (status) {

            status.innerText =
                "Unlock করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";


            status.style.color =
                "#dc2626";
        }

    }

}


/* =====================================================
   GO TO ORIGINAL URL
   ===================================================== */

function goToOriginalUrl() {


    if (!originalUrl) {

        showError(
            "Original Link পাওয়া যায়নি।"
        );

        return;
    }


    window.location.href =
        originalUrl;

}


/* =====================================================
   SHOW ERROR
   ===================================================== */

function showError(
    message
) {


    const container =
        document.getElementById(
            "redirectMessage"
        );


    if (!container) {

        return;
    }


    container.innerHTML = `

        <div class="unlock-box">

            <div
                style="
                    font-size:50px;
                    margin-bottom:15px;
                "
            >
                ❌
            </div>


            <h2>
                দুঃখিত!
            </h2>


            <p>
                ${message}
            </p>


            <button
                type="button"
                onclick="window.location.href='/'"
                style="
                    width:100%;
                    border:none;
                    background:#2563eb;
                    color:white;
                    padding:14px;
                    border-radius:10px;
                    font-size:16px;
                    font-weight:700;
                    cursor:pointer;
                "
            >
                Home এ ফিরে যান
            </button>

        </div>

    `;

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        handleShortLink();

    }
);

</script>
