<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - BDTxEarning</title>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }


        /* =========================
           Navbar
        ========================= */

        .navbar {
            background: #111827;
            color: white;

            padding: 15px 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .logo {
            color: #22c55e;

            font-size: 24px;

            font-weight: bold;
        }


        .nav-right {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .nav-right a,
        .logout-btn {
            color: white;

            text-decoration: none;

            background: transparent;

            border: none;

            cursor: pointer;

            font-size: 14px;

            padding: 7px 10px;
        }


        .nav-right a:hover,
        .logout-btn:hover {
            color: #22c55e;
        }


        /* =========================
           Container
        ========================= */

        .container {
            max-width: 1150px;

            margin: auto;

            padding: 25px 15px;
        }


        /* =========================
           Welcome
        ========================= */

        .welcome-card {
            background: white;

            padding: 25px;

            border-radius: 14px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.06);
        }


        .welcome-card h1 {
            font-size: 25px;

            margin-bottom: 8px;
        }


        .welcome-card p {
            color: #6b7280;

            margin-top: 5px;
        }


        .referral-code {
            display: inline-block;

            margin-top: 12px;

            padding: 8px 12px;

            background: #dcfce7;

            color: #166534;

            border-radius: 7px;

            font-weight: bold;
        }


        /* =========================
           Stats
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 20px;
        }


        .stat-card {
            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.05);
        }


        .stat-card h3 {
            font-size: 14px;

            color: #6b7280;

            margin-bottom: 8px;
        }


        .stat-card strong {
            font-size: 25px;

            color: #111827;
        }


        /* =========================
           Main Cards
        ========================= */

        .card {
            background: white;

            padding: 25px;

            border-radius: 14px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.06);
        }


        .card-title {
            font-size: 21px;

            margin-bottom: 18px;
        }


        /* =========================
           Message
        ========================= */

        .message {
            display: none;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 14px;
        }


        .success {
            background: #dcfce7;

            color: #166534;
        }


        .error {
            background: #fee2e2;

            color: #991b1b;
        }


        /* =========================
           Shortener
        ========================= */

        .shortener {
            display: flex;

            gap: 10px;
        }


        .url-input {
            flex: 1;

            padding: 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        .url-input:focus {
            border-color: #22c55e;

            box-shadow:
                0 0 0 2px
                rgba(34,197,94,0.12);
        }


        .shorten-btn {
            padding: 13px 22px;

            border: none;

            border-radius: 8px;

            background: #22c55e;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .shorten-btn:hover {
            background: #16a34a;
        }


        /* =========================
           Result
        ========================= */

        .short-result {
            display: none;

            margin-top: 15px;

            padding: 15px;

            background: #f0fdf4;

            border-radius: 9px;

            border: 1px solid #bbf7d0;
        }


        .short-result a {
            color: #15803d;

            font-weight: bold;

            word-break: break-all;
        }


        .copy-btn {
            margin-top: 12px;

            padding: 9px 15px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            cursor: pointer;
        }


        .copy-btn:hover {
            background: #1d4ed8;
        }


        /* =========================
           Links
        ========================= */

        .link-item {
            border: 1px solid #e5e7eb;

            padding: 18px;

            border-radius: 10px;

            margin-bottom: 12px;

            background: #ffffff;
        }


        .link-label {
            font-size: 13px;

            color: #6b7280;

            margin-bottom: 4px;
        }


        .original-url {
            word-break: break-all;

            color: #374151;

            font-size: 14px;
        }


        .short-url {
            word-break: break-all;

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

            font-size: 15px;
        }


        .short-url:hover {
            text-decoration: underline;
        }


        .link-bottom {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 12px;

            gap: 10px;

            flex-wrap: wrap;
        }


        .click-badge {
            display: inline-block;

            background: #dcfce7;

            color: #15803d;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }


        .copy-small {
            padding: 7px 12px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;
        }


        /* =========================
           Loading
        ========================= */

        .loading {
            text-align: center;

            padding: 25px;

            color: #6b7280;
        }


        /* =========================
           Footer
        ========================= */

        footer {
            text-align: center;

            padding: 30px;

            color: #6b7280;
        }


        /* =========================
           Mobile
        ========================= */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .navbar {
                padding: 14px 20px;
            }


            .logo {
                font-size: 20px;
            }


            .shortener {
                flex-direction: column;
            }


            .shorten-btn {
                width: 100%;
            }


            .stats {
                grid-template-columns: 1fr 1fr;
            }


            .welcome-card h1 {
                font-size: 21px;
            }

        }


        @media (max-width: 400px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         Navbar
    ========================= -->

    <header class="navbar">

        <div class="logo">
            BDTxEarning
        </div>


        <div class="nav-right">

            <a href="index.html">
                Home
            </a>

            <button
                class="logout-btn"
                onclick="logoutUser()"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- =========================
         Dashboard
    ========================= -->

    <main class="container">


        <!-- Welcome -->

        <section class="welcome-card">

            <h1>
                Welcome, <span id="userName">User</span> 👋
            </h1>

            <p>
                Username:
                <strong id="userUsername">...</strong>
            </p>

            <p>
                Email:
                <strong id="userEmail">...</strong>
            </p>

            <span
                class="referral-code"
                id="referralCode"
            >
                Referral Code: ...
            </span>

        </section>



        <!-- =========================
             Stats
        ========================= -->

        <section class="stats">


            <div class="stat-card">

                <h3>
                    💰 Balance
                </h3>

                <strong id="balance">
                    ৳0.00
                </strong>

            </div>


            <div class="stat-card">

                <h3>
                    👥 Referral Balance
                </h3>

                <strong id="referralBalance">
                    ৳0.00
                </strong>

            </div>


            <div class="stat-card">

                <h3>
                    🔗 Total Links
                </h3>

                <strong id="totalLinks">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <h3>
                    👆 Total Clicks
                </h3>

                <strong id="totalClicks">
                    0
                </strong>

            </div>


        </section>



        <!-- =========================
             Link Shortener
        ========================= -->

        <section class="card">

            <h2 class="card-title">
                🔗 Shorten Your Link
            </h2>


            <div
                id="message"
                class="message"
            ></div>


            <div class="shortener">

                <input
                    type="url"
                    id="longUrl"
                    class="url-input"
                    placeholder="https://example.com/your-long-link"
                >


                <button
                    id="shortenButton"
                    class="shorten-btn"
                    onclick="shortenLink()"
                >
                    Shorten Link
                </button>

            </div>


            <!-- Result -->

            <div
                id="shortResult"
                class="short-result"
            >

                <div class="link-label">
                    Your Short Link:
                </div>


                <a
                    id="newShortLink"
                    href="#"
                    target="_blank"
                >
                </a>


                <br>


                <button
                    class="copy-btn"
                    onclick="copyNewLink()"
                >
                    📋 Copy Link
                </button>

            </div>

        </section>



        <!-- =========================
             My Links
        ========================= -->

        <section class="card">

            <h2 class="card-title">
                📊 My Links
            </h2>


            <div id="linksList">

                <div class="loading">
                    Links Loading...
                </div>

            </div>

        </section>


    </main>



    <footer>

        © 2026 BDTxEarning — All Rights Reserved

    </footer>



    <script>


        /* =========================
           SUPABASE
        ========================= */


        const SUPABASE_URL =
            "https://hmshjrqrogczsvxtwkqi.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_tLNKwPxwoceKvJG2DpR6jw_VE9KaExr";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        let currentShortLink = "";



        /* =========================
           HTML ESCAPE
        ========================= */


        function escapeHtml(text) {

            if (!text) return "";

            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }



        /* =========================
           MESSAGE
        ========================= */


        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.innerText = text;


            message.className =
                "message " + type;


            message.style.display =
                "block";
        }



        /* =========================
           GET USER
        ========================= */


        async function getCurrentUser() {

            const {
                data
            } =
                await supabaseClient.auth
                    .getSession();


            return data.session?.user || null;
        }



        /* =========================
           LOAD DASHBOARD
        ========================= */


        async function loadDashboard() {


            const user =
                await getCurrentUser();


            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }


            /* User Information */

            document
                .getElementById("userEmail")
                .innerText =
                user.email || "";


            /* Profile */

            const {
                data: profile,
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .select("*")
                    .eq("id", user.id)
                    .maybeSingle();


            if (error) {

                showMessage(
                    "Profile পাওয়া যায়নি: " +
                    error.message,
                    "error"
                );

            }


            if (profile) {

                document
                    .getElementById("userName")
                    .innerText =
                    profile.full_name ||
                    "User";


                document
                    .getElementById("userUsername")
                    .innerText =
                    profile.username ||
                    "";


                document
                    .getElementById("balance")
                    .innerText =
                    "৳" +
                    Number(
                        profile.balance || 0
                    ).toFixed(2);


                document
                    .getElementById("referralBalance")
                    .innerText =
                    "৳" +
                    Number(
                        profile.referral_balance || 0
                    ).toFixed(2);


                document
                    .getElementById("referralCode")
                    .innerText =
                    "Referral Code: " +
                    (
                        profile.referral_code ||
                        "N/A"
                    );

            }


            await loadLinks();

        }



        /* =========================
           GENERATE CODE
        ========================= */


        function generateCode(length = 6) {

            const characters =
                "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


            let code = "";


            for (
                let i = 0;
                i < length;
                i++
            ) {

                code +=
                    characters.charAt(
                        Math.floor(
                            Math.random() *
                            characters.length
                        )
                    );

            }


            return code;
        }



        /* =========================
           SHORTEN LINK
        ========================= */


        async function shortenLink() {


            const user =
                await getCurrentUser();


            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }


            const longUrl =
                document
                    .getElementById("longUrl")
                    .value
                    .trim();


            if (!longUrl) {

                showMessage(
                    "একটি URL দিন।",
                    "error"
                );

                return;
            }


            /* URL Validation */

            try {

                const url =
                    new URL(longUrl);


                if (
                    url.protocol !== "http:" &&
                    url.protocol !== "https:"
                ) {

                    throw new Error();

                }

            } catch {

                showMessage(
                    "সঠিক URL দিন। যেমন: https://example.com",
                    "error"
                );

                return;
            }


            const button =
                document.getElementById(
                    "shortenButton"
                );


            button.disabled = true;

            button.innerText =
                "Creating...";


            showMessage(
                "Short Link তৈরি হচ্ছে...",
                "success"
            );


            const shortCode =
                generateCode(6);


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("links")
                    .insert([{

                        user_id:
                            user.id,

                        original_url:
                            longUrl,

                        short_code:
                            shortCode

                    }])
                    .select()
                    .single();


            button.disabled = false;

            button.innerText =
                "Shorten Link";


            if (error) {

                showMessage(
                    error.message,
                    "error"
                );

                return;
            }


            const shortUrl =
                window.location.origin +
                "/?c=" +
                data.short_code;


            currentShortLink =
                shortUrl;


            document
                .getElementById("newShortLink")
                .innerText =
                shortUrl;


            document
                .getElementById("newShortLink")
                .href =
                shortUrl;


            document
                .getElementById("shortResult")
                .style.display =
                "block";


            document
                .getElementById("longUrl")
                .value = "";


            showMessage(
                "✅ Link সফলভাবে Short হয়েছে!",
                "success"
            );


            await loadLinks();

        }



        /* =========================
           COPY NEW LINK
        ========================= */


        async function copyNewLink() {


            if (!currentShortLink) {

                return;
            }


            try {

                await navigator.clipboard
                    .writeText(
                        currentShortLink
                    );


                alert(
                    "✅ Short Link Copy হয়েছে!"
                );

            } catch {

                alert(
                    "Copy করা যায়নি। Link টি Copy করুন।"
                );

            }

        }



        /* =========================
           COPY OLD LINK
        ========================= */


        async function copyLink(url) {

            try {

                await navigator.clipboard
                    .writeText(url);


                alert(
                    "✅ Link Copy হয়েছে!"
                );

            } catch {

                alert(
                    "Copy করা যায়নি।"
                );

            }

        }



        /* =========================
           LOAD LINKS
        ========================= */


        async function loadLinks() {


            const user =
                await getCurrentUser();


            if (!user) {

                return;
            }


            const {
                data: links,
                error
            } =
                await supabaseClient
                    .from("links")
                    .select("*")
                    .eq(
                        "user_id",
                        user.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                document
                    .getElementById(
                        "linksList"
                    )
                    .innerHTML = `

                        <div class="message error"
                             style="display:block;">

                            ${escapeHtml(
                                error.message
                            )}

                        </div>

                    `;

                return;
            }


            const totalLinks =
                links?.length || 0;


            const totalClicks =
                (links || [])
                    .reduce(
                        function(
                            total,
                            link
                        ) {

                            return total +
                                Number(
                                    link.clicks || 0
                                );

                        },
                        0
                    );


            document
                .getElementById(
                    "totalLinks"
                )
                .innerText =
                totalLinks;


            document
                .getElementById(
                    "totalClicks"
                )
                .innerText =
                totalClicks;


            /* No Links */

            if (
                !links ||
                links.length === 0
            ) {

                document
                    .getElementById(
                        "linksList"
                    )
                    .innerHTML = `

                        <div class="loading">

                            এখনো কোনো Short Link তৈরি করেননি।

                        </div>

                    `;

                return;
            }


            /* Links */

            let html = "";


            links.forEach(
                function(link) {


                    const shortUrl =
                        window.location.origin +
                        "/?c=" +
                        link.short_code;


                    html += `

                        <div class="link-item">


                            <div class="link-label">

                                Original Link

                            </div>


                            <div class="original-url">

                                ${escapeHtml(
                                    link.original_url
                                )}

                            </div>


                            <div
                                class="link-label"
                                style="margin-top:12px;"
                            >

                                Short Link

                            </div>


                            <a
                                href="${escapeHtml(
                                    shortUrl
                                )}"
                                target="_blank"
                                class="short-url"
                            >

                                ${escapeHtml(
                                    shortUrl
                                )}

                            </a>


                            <div class="link-bottom">


                                <span class="click-badge">

                                    👆
                                    ${Number(
                                        link.clicks || 0
                                    )}
                                    Clicks

                                </span>


                                <button
                                    class="copy-small"
                                    onclick="copyLink(
                                        '${escapeHtml(
                                            shortUrl
                                        )}'
                                    )"
                                >

                                    📋 Copy

                                </button>


                            </div>


                        </div>

                    `;

                }
            );


            document
                .getElementById(
                    "linksList"
                )
                .innerHTML =
                html;

        }



        /* =========================
           LOGOUT
        ========================= */


        async function logoutUser() {


            await supabaseClient.auth
                .signOut();


            window.location.href =
                "login.html";

        }



        /* =========================
           PUBLIC SHORT LINK
           CLICK COUNTER + REDIRECT
        ========================= */


        async function handleShortLink() {


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const code =
                params.get("c");


            if (!code) {

                return false;
            }


            document.body.innerHTML = `

                <div style="
                    min-height:100vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    text-align:center;
                    font-family:Arial;
                ">

                    <div>

                        <h2>
                            Redirecting...
                        </h2>

                        <p style="
                            margin-top:10px;
                            color:#666;
                        ">
                            আপনার Link খোলা হচ্ছে...
                        </p>

                    </div>

                </div>

            `;


            /*
                এই RPC Function:

                1. Short Code খুঁজবে
                2. Click +1 করবে
                3. Original URL ফেরত দেবে
            */


            const {
                data,
                error
            } =
                await supabaseClient
                    .rpc(
                        "open_short_link",
                        {
                            code: code
                        }
                    );


            if (
                error ||
                !data
            ) {

                document.body.innerHTML = `

                    <div style="
                        min-height:100vh;
                        display:flex;
                        justify-content:center;
                        align-items:center;
                        text-align:center;
                        font-family:Arial;
                        padding:20px;
                    ">

                        <div>

                            <h2>
                                ❌ Link পাওয়া যায়নি
                            </h2>

                            <p style="
                                margin-top:10px;
                                color:#666;
                            ">
                                Short Link টি ভুল
                                অথবা আর নেই।
                            </p>

                            <br>

                            <a
                                href="index.html"
                                style="
                                    color:#2563eb;
                                "
                            >
                                BDTxEarning Home
                            </a>

                        </div>

                    </div>

                `;

                return true;
            }


            /* Redirect */

            window.location.replace(
                data
            );


            return true;

        }



        /* =========================
           START
        ========================= */


        async function startDashboard() {


            /*
                আগে দেখি URL-এ ?c= আছে কিনা।
                থাকলে এটি Public Short Link।
            */


            const redirected =
                await handleShortLink();


            if (redirected) {

                return;
            }


            /*
                Normal Dashboard
            */


            await loadDashboard();

        }



        /* =========================
           AUTH STATE
        ========================= */


        supabaseClient.auth
            .onAuthStateChange(
                function(
                    event,
                    session
                ) {

                    if (
                        event ===
                        "SIGNED_OUT"
                    ) {

                        window.location.href =
                            "login.html";

                    }

                }
            );



        /* =========================
           START APP
        ========================= */


        startDashboard();


    </script>


</body>

</html>
